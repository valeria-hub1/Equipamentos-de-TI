{% extends "base.html" %}

{% block title %}
Cadastro de Equipamento | Gestão de TI
{% endblock %}

{% block content %}

<div class="page-header">

    <div>

        <h1>

            {% if equipamento %}
                Editar equipamento
            {% else %}
                Cadastrar equipamento
            {% endif %}

        </h1>

        <p>
            Informe os dados do equipamento.
        </p>

    </div>

</div>


<form method="POST" class="form-card">


    <label>

        Patrimônio

        <input
            type="text"
            name="patrimonio"
            required
            value="{{ equipamento.patrimonio if equipamento else '' }}"
        >

    </label>


    <label>

        Tipo

        <select name="tipo" required>

            <option value="">
                Selecione o tipo
            </option>

            <option value="Notebook">
                Notebook
            </option>

            <option value="Computador">
                Computador
            </option>

            <option value="Impressora">
                Impressora
            </option>

            <option value="Servidor">
                Servidor
            </option>

            <option value="Monitor">
                Monitor
            </option>

            <option value="Roteador">
                Roteador
            </option>

            <option value="Switch">
                Switch
            </option>

            <option value="Outro">
                Outro
            </option>

        </select>

    </label>


    <label>

        Marca

        <input
            type="text"
            name="marca"
            required
            value="{{ equipamento.marca if equipamento else '' }}"
        >

    </label>


    <label>

        Modelo

        <input
            type="text"
            name="modelo"
            required
            value="{{ equipamento.modelo if equipamento else '' }}"
        >

    </label>


    <label>

        Número de série

        <input
            type="text"
            name="numero_serie"
            required
            value="{{ equipamento.numero_serie if equipamento else '' }}"
        >

    </label>


    <label>

        Data de aquisição

        <input
            type="date"
            name="data_aquisicao"
            required
            value="{{ equipamento.data_aquisicao.strftime('%Y-%m-%d') if equipamento else '' }}"
        >

    </label>


    <label>

        Localização

        <input
            type="text"
            name="localizacao"
            required
            value="{{ equipamento.localizacao if equipamento else '' }}"
        >

    </label>


    <label>

        Status

        <select name="status" required>

            <option value="Em Uso">
                Em Uso
            </option>

            <option value="Em Manutenção">
                Em Manutenção
            </option>

            <option value="Desativado">
                Desativado
            </option>

            <option value="Descartado">
                Descartado
            </option>

        </select>

    </label>


    <button
        class="btn"
        type="submit"
    >
        Salvar equipamento
    </button>


    <a
        href="{{ url_for('equipamentos') }}"
    >
        Cancelar
    </a>


</form>

{% endblock %}
